name: Maven Test Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn clean test

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  database-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: greenkart_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize Database Fixture
        run: mysql -h 127.0.0.1 -uroot -proot greenkart_db < src/test/resources/init.sql

      - name: Run Database Test Suite
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/greenkart_db
          DB_USERNAME: root
          DB_PASSWORD: root
        run: mvn -Dtestng.suite=testng-db.xml clean test

      - name: Upload Database Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-surefire-reports
          path: target/surefire-reports/
